name: build

# Gera os dois executaveis. E o caminho recomendado para o binario Linux: o
# PyInstaller nao cross-compila, entao cada sistema precisa rodar o seu.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            artifact: QuebrandoTijolos.exe
          - label: Linux
            os: ubuntu-latest
            artifact: QuebrandoTijolos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Rodar os testes
        run: python run_tests.py

      - name: Empacotar e verificar o binario
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: QuebrandoTijolos-${{ matrix.label }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
